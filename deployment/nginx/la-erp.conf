# LA-ERP 恢复版 · nginx 反向代理示例
#
# 恢复端是前后端分离：后端只提供 /api/... 、/uploads/... 和 /health，
# 前端是 frontend/dist 的静态产物。原版是前后端一体（后端托管前端），
# 恢复版必须由反代把这两部分拼起来 —— README 已说明这一点。
#
# 用法：复制到 /etc/nginx/conf.d/la-erp.conf，按需改 server_name、
#       证书路径、root 路径，然后 nginx -t && systemctl reload nginx。

upstream la_erp_backend {
    server 127.0.0.1:18887;
    keepalive 32;
}

server {
    listen 80;
    server_name erp.example.com;

    # 生产环境应改为 443 + ssl_certificate / ssl_certificate_key，
    # 并把 80 端口整体 301 到 https。此处保留 80 便于内网/测试使用。
    # return 301 https://$host$request_uri;

    # 前端构建产物
    root /opt/la-erp/frontend/dist;
    index index.html;

    # 与服务端 upload.max_size（默认 10MB）保持一致，
    # 否则大图上传会在 nginx 层先被拒（413）。
    client_max_body_size 10m;

    # 访问日志：后端自己也在打（access method=... status=... took=...），
    # 这里加 $request_time 便于对比「反代耗时」与「后端处理耗时」。
    access_log /var/log/nginx/la-erp.access.log main;
    error_log  /var/log/nginx/la-erp.error.log warn;

    # ── 后端接口 ──────────────────────────────────────────────
    # 注意：不要在这里加斜杠。后端已把 /api/v1/xxx/ 与 /api/v1/xxx
    # 视为同一路由（见 ServeHTTP 的尾斜杠归一化），
    # proxy_pass 带 URI 反而会改写路径。
    location /api/ {
        proxy_pass http://la_erp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 报表导出、MRP 运算可能较慢；后端已配 WriteTimeout 30s，
        # 这里保持一致，避免反代先超时而后端还在算。
        proxy_buffering off;
    }

    # 健康检查（后端 /health 返回 {"status":"OK"}）
    location = /health {
        proxy_pass http://la_erp_backend;
        access_log off;
    }

    # ── 上传文件 ──────────────────────────────────────────────
    # 后端把图片写在 <upload.path>/images/ 下，并以 /uploads/images/xxx 对外。
    # 直接由 nginx 提供静态文件，比回源到 Go 更省资源。
    location /uploads/ {
        alias /opt/la-erp/data/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        # 只允许前端读取，不允许列目录
        autoindex off;
    }

    # ── 前端 SPA ──────────────────────────────────────────────
    # 单页应用：未知路径回落到 index.html，交给前端路由处理。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 前端产物带 hash 的静态资源可长缓存；index.html 不要缓存，
    # 否则发版后用户还拿到旧的入口文件。
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
