name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - run: npm test
      - run: go test ./...
        working-directory: backend
      - run: go vet ./...
        working-directory: backend
      - run: go build -o la-erp-server ./cmd/la-erp-server
        working-directory: backend
      - run: node tests/server-smoke.mjs backend/la-erp-server
      - run: node tests/mrp-smoke.mjs backend/la-erp-server
      - uses: actions/upload-artifact@v4
        with:
          name: la-erp-backend-linux-amd64
          path: backend/la-erp-server
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
